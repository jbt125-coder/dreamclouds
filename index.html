<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cloud Dreams">
<meta name="theme-color" content="#07060d">
<title>Cloud Dreams</title>
<style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;background:#07060d;position:fixed;
 touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:rgba(0,0,0,0);overscroll-behavior:none}
canvas{position:absolute;left:0;top:0;width:100%;height:100%;display:block}
#sky{z-index:1}
#ink{z-index:2}
.pen{font-family:"Noteworthy","Marker Felt","Chalkboard SE","Comic Sans MS",cursive}
#bar{position:absolute;z-index:5;left:0;right:0;top:0;padding:12px 14px 0 14px;padding-top:calc(env(safe-area-inset-top) + 8px);
 display:flex;justify-content:space-between;align-items:center;pointer-events:none}
#tools{display:flex}
.ib{pointer-events:auto;width:40px;height:40px;border-radius:20px;border:1px solid rgba(243,239,255,0.26);
 background:rgba(14,10,30,0.34);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);
 display:flex;align-items:center;justify-content:center;margin-left:9px;opacity:0.72;padding:0;cursor:pointer}
.ib:active{opacity:1}
.ib.off{opacity:0.34}
.ib svg{width:22px;height:22px;display:block}
#jr{pointer-events:auto;height:38px;border-radius:19px;border:1px solid rgba(243,239,255,0.26);background:rgba(14,10,30,0.34);
 -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);color:#f3efff;font-size:19px;display:flex;align-items:center;
 padding:0 15px 0 11px;opacity:0.8;cursor:pointer;transition:transform 0.4s}
#jr.pulse{transform:scale(1.18)}
#jr i{display:block;width:13px;height:13px;border-radius:7px;margin-right:8px;
 background:radial-gradient(circle at 35% 30%,#fff4c8 0%,#ecc768 35%,#b8872c 75%,#6b4a12 100%)}
#prompt{position:absolute;z-index:4;left:0;right:0;bottom:30px;bottom:calc(env(safe-area-inset-bottom) + 26px);
 padding:0 30px;box-sizing:border-box;text-align:center;color:#f3efff;font-size:21px;line-height:1.3;
 text-shadow:0 1px 10px rgba(6,4,16,0.95),0 0 3px rgba(6,4,16,0.9);opacity:0;transition:opacity 1.4s;pointer-events:none}
#intro{position:absolute;z-index:8;left:0;top:0;right:0;bottom:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
 background:radial-gradient(ellipse at 50% 45%,rgba(7,6,14,0.35) 0%,rgba(7,6,14,0.78) 75%);color:#f3efff;text-align:center;transition:opacity 1.2s}
#intro h1{margin:0;font-size:54px;font-weight:normal;line-height:1;text-shadow:0 2px 18px rgba(30,20,80,0.9)}
#intro .sub{margin:16px 34px 30px 34px;font-size:19px;line-height:1.35;opacity:0.9;max-width:320px}
#guide{display:table;margin:0 auto;font-size:17px;line-height:1.25}
#guide div{display:table-row}
#guide span{display:table-cell;padding:6px 8px;text-align:left}
#guide span.g{color:#ecc768;text-align:right}
#intro .go{margin-top:38px;font-size:20px;animation:breathe 2.6s ease-in-out infinite}
@keyframes breathe{0%,100%{opacity:0.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){#intro .go{animation:none;opacity:0.85}}
#book{position:absolute;z-index:9;left:0;top:0;right:0;bottom:0;background:rgba(7,6,14,0.9);color:#f3efff;display:none;
 overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y}
#bookIn{padding:20px 18px 40px 18px;padding-top:calc(env(safe-area-inset-top) + 18px);padding-bottom:calc(env(safe-area-inset-bottom) + 30px);max-width:520px;margin:0 auto}
#book h2{margin:0;font-size:34px;font-weight:normal}
#bookStat{font-size:17px;opacity:0.8;margin:6px 0 18px 0;line-height:1.35}
#cards{display:flex;flex-wrap:wrap;justify-content:space-between}
.card{width:31%;margin-bottom:14px;text-align:center}
.card canvas{position:static;width:100%;height:auto}
.card div{font-size:15px;margin-top:3px;opacity:0.9}
.card div.n{opacity:0.4}
#closeBook{display:block;margin:18px auto 0 auto;font-size:20px;color:#f3efff;background:rgba(243,239,255,0.08);
 border:1px solid rgba(243,239,255,0.3);border-radius:24px;padding:10px 26px;cursor:pointer}
</style>
</head>
<body>
<canvas id="sky"></canvas>
<canvas id="ink"></canvas>

<div id="bar">
 <div id="jr" class="pen"><i></i><span id="jrN">0</span></div>
 <div id="tools">
  <button class="ib" id="bDisc" aria-label="Discovery hints">
   <svg viewBox="0 0 24 24" fill="none" stroke="#f3efff" stroke-width="1.5" stroke-linecap="round"><path d="M3 12c3-5 15-5 18 0c-3 5-15 5-18 0z"/><circle cx="12" cy="12" r="2.6" fill="#ecc768" stroke="none"/></svg>
  </button>
  <button class="ib" id="bSnd" aria-label="Sound"></button>
  <button class="ib" id="bReset" aria-label="Fresh sky">
   <svg viewBox="0 0 24 24" fill="none" stroke="#f3efff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12a7 7 0 1 1-2.2-5.1"/><path d="M17.5 3.5v3.8h-3.8"/></svg>
  </button>
 </div>
</div>

<div id="prompt" class="pen"></div>

<div id="intro" class="pen">
 <h1>Cloud Dreams</h1>
 <div class="sub">Lie back and watch the sky. Touch it and see what it becomes.</div>
 <div id="guide">
  <div><span class="g">drag</span><span>stir the wind</span></div>
  <div><span class="g">tap</span><span>drop water and watch it bloom</span></div>
  <div><span class="g">double tap</span><span>transform a cloud</span></div>
  <div><span class="g">hold</span><span>pause a cloud to study it</span></div>
  <div><span class="g">two fingers</span><span>squeeze, stretch and twist</span></div>
 </div>
 <div class="go">Tap anywhere to begin</div>
</div>

<div id="book" class="pen">
 <div id="bookIn">
  <h2>Sky journal</h2>
  <div id="bookStat"></div>
  <div id="cards"></div>
  <button id="closeBook" class="pen">Back to the sky</button>
 </div>
</div>

<script>
(function(){
'use strict';
var DOC = document;
var sky = DOC.getElementById('sky');
var ink = DOC.getElementById('ink');
var ictx = ink.getContext('2d');
var W = 0, H = 0, DPR = 1, GLS = 0.75;
var time = 0, last = 0, paused = false, started = false;
var PEN = '#f3efff';
var FONT = '"Noteworthy","Marker Felt","Chalkboard SE","Comic Sans MS",cursive';

/* ================= helpers ================= */
function rnd(a, b){ return a + Math.random() * (b - a); }
function pick(arr){ return arr[Math.floor(Math.random() * arr.length)]; }
function clamp(x, a, b){ return x < a ? a : (x > b ? b : x); }
function smooth(e){ e = clamp(e, 0, 1); return e * e * (3 - 2 * e); }
function hash2(x, y){ var s = Math.sin(x * 127.1 + y * 311.7) * 43758.5453; return s - Math.floor(s); }
function vnoise(x, y){
  var ix = Math.floor(x), iy = Math.floor(y), fx = x - ix, fy = y - iy;
  fx = fx * fx * (3 - 2 * fx); fy = fy * fy * (3 - 2 * fy);
  var a = hash2(ix, iy), b = hash2(ix + 1, iy), c = hash2(ix, iy + 1), d = hash2(ix + 1, iy + 1);
  return a + (b - a) * fx + (c - a) * fy + (a - b - c + d) * fx * fy;
}
function now(){ return (window.performance && performance.now) ? performance.now() : Date.now(); }
/* ellipse helper (no ctx.ellipse) */
function CE(c, x, y, rx, ry, rot){
  c.save(); c.translate(x, y); c.rotate(rot || 0); c.scale(rx, ry);
  c.moveTo(1, 0); c.arc(0, 0, 1, 0, 6.2832); c.restore();
}

/* ================= fluid grid ================= */
var NX = 84, NY = 0, N = 0, CS = 1, VNY = 0;
var u, v, u2, v2, pr, dv, cw, frz, D, E, XL, XR, texData;
var colCa, colSa, colCA, colSA, rowCb, rowSb, rowCB, rowSB;
var totalMass = 0;

function allocGrid(ny){
  var oN = N, oNY = NY, oD = D, ou = u, ov = v, k, i;
  NY = ny; N = NX * NY;
  u = new Float32Array(N); v = new Float32Array(N); u2 = new Float32Array(N); v2 = new Float32Array(N);
  pr = new Float32Array(N); dv = new Float32Array(N); cw = new Float32Array(N); frz = new Float32Array(N);
  D = []; E = [];
  for (k = 0; k < 4; k++){ D.push(new Float32Array(N)); E.push(new Float32Array(N)); }
  texData = new Uint8Array(N * 4);
  if (oN > 0){
    var m = Math.min(oNY, NY) * NX;
    for (i = 0; i < m; i++){ u[i] = ou[i]; v[i] = ov[i]; for (k = 0; k < 4; k++) D[k][i] = oD[k][i]; }
  }
  XL = new Int32Array(NX); XR = new Int32Array(NX);
  for (var x = 0; x < NX; x++){ XL[x] = x === 0 ? NX - 1 : x - 1; XR[x] = x === NX - 1 ? 0 : x + 1; }
  colCa = new Float32Array(NX); colSa = new Float32Array(NX); colCA = new Float32Array(NX); colSA = new Float32Array(NX);
  rowCb = new Float32Array(NY); rowSb = new Float32Array(NY); rowCB = new Float32Array(NY); rowSB = new Float32Array(NY);
}

function breeze(){ return 1.8 + 0.9 * Math.sin(time * 0.013) + 0.35 * Math.sin(time * 0.041); }

/* gentle curl-noise sky currents + breeze (separable trig = cheap) */
function ambient(dt){
  var t = time * 0.05, x, y, i, bz = breeze(), AMP = 14;
  for (x = 0; x < NX; x++){
    var a = x * 0.09 + t, A = x * 0.153 + t * 1.3;
    colCa[x] = Math.cos(a); colSa[x] = Math.sin(a); colCA[x] = Math.cos(A); colSA[x] = Math.sin(A);
  }
  for (y = 0; y < NY; y++){
    var b = y * 0.07 - t * 0.7, B = y * 0.091;
    rowCb[y] = Math.cos(b); rowSb[y] = Math.sin(b); rowCB[y] = Math.cos(B); rowSB[y] = Math.sin(B);
  }
  var k = 0.32 * dt;
  for (y = 0; y < NY; y++){
    for (x = 0; x < NX; x++){
      i = x + y * NX;
      var cc = colCA[x] * rowCB[y] + colSA[x] * rowSB[y];
      var dpx = 0.09 * (colCa[x] * rowCb[y] + 1.02 * cc);
      var dpy = 0.07 * (-colSa[x] * rowSb[y] - 0.78 * cc);
      var kk = k * (1 - frz[i]);
      u[i] += (dpy * AMP + bz - u[i]) * kk;
      v[i] += (-dpx * AMP - v[i]) * kk;
    }
  }
}

/* vorticity confinement = billowy curls */
function vorticity(dt){
  var x, y, i, VORT = 5.5;
  for (y = 0; y < NY; y++){
    for (x = 0; x < NX; x++){
      i = x + y * NX;
      var vu = y > 0 ? u[i - NX] : u[i], vd = y < NY - 1 ? u[i + NX] : u[i];
      cw[i] = 0.5 * ((v[XR[x] + y * NX] - v[XL[x] + y * NX]) - (vd - vu));
    }
  }
  for (y = 1; y < NY - 1; y++){
    for (x = 0; x < NX; x++){
      i = x + y * NX;
      var gx = 0.5 * (Math.abs(cw[XR[x] + y * NX]) - Math.abs(cw[XL[x] + y * NX]));
      var gy = 0.5 * (Math.abs(cw[i + NX]) - Math.abs(cw[i - NX]));
      var len = Math.sqrt(gx * gx + gy * gy) + 1e-5;
      var f = VORT * dt * (1 - frz[i]);
      u[i] += f * (gy / len) * cw[i];
      v[i] -= f * (gx / len) * cw[i];
    }
  }
}

/* semi-Lagrangian advection of velocity + 4 pigments in one pass */
function advect(dt){
  var x, y, i;
  var d0 = D[0], d1 = D[1], d2 = D[2], d3 = D[3], e0 = E[0], e1 = E[1], e2 = E[2], e3 = E[3];
  for (y = 0; y < NY; y++){
    for (x = 0; x < NX; x++){
      i = x + y * NX;
      var f = 1 - frz[i];
      var px = x - dt * u[i] * f, py = y - dt * v[i] * f;
      px = px % NX; if (px < 0) px += NX;
      if (py < 0) py = 0; else if (py > NY - 1.001) py = NY - 1.001;
      var x0 = px | 0, y0 = py | 0, fx = px - x0, fy = py - y0, x1 = x0 + 1;
      if (x0 >= NX){ x0 = NX - 1; }
      if (x1 >= NX) x1 = 0;
      var i00 = x0 + y0 * NX, i10 = x1 + y0 * NX, i01 = i00 + NX, i11 = i10 + NX;
      var a = (1 - fx) * (1 - fy), b = fx * (1 - fy), c = (1 - fx) * fy, e = fx * fy;
      u2[i] = u[i00] * a + u[i10] * b + u[i01] * c + u[i11] * e;
      v2[i] = v[i00] * a + v[i10] * b + v[i01] * c + v[i11] * e;
      e0[i] = d0[i00] * a + d0[i10] * b + d0[i01] * c + d0[i11] * e;
      e1[i] = d1[i00] * a + d1[i10] * b + d1[i01] * c + d1[i11] * e;
      e2[i] = d2[i00] * a + d2[i10] * b + d2[i01] * c + d2[i11] * e;
      e3[i] = d3[i00] * a + d3[i10] * b + d3[i01] * c + d3[i11] * e;
    }
  }
  var t = u; u = u2; u2 = t; t = v; v = v2; v2 = t;
  t = D; D = E; E = t;
}

function project(iters){
  var x, y, i, it;
  for (y = 0; y < NY; y++){
    for (x = 0; x < NX; x++){
      i = x + y * NX;
      var vd = y < NY - 1 ? v[i + NX] : 0, vu = y > 0 ? v[i - NX] : 0;
      dv[i] = -0.5 * (u[XR[x] + y * NX] - u[XL[x] + y * NX] + vd - vu);
    }
  }
  for (it = 0; it < iters; it++){
    for (y = 0; y < NY; y++){
      for (x = 0; x < NX; x++){
        i = x + y * NX;
        var s = pr[XL[x] + y * NX] + pr[XR[x] + y * NX], n = 2;
        if (y > 0){ s += pr[i - NX]; n++; }
        if (y < NY - 1){ s += pr[i + NX]; n++; }
        pr[i] = (dv[i] + s) / n;
      }
    }
  }
  for (y = 0; y < NY; y++){
    for (x = 0; x < NX; x++){
      i = x + y * NX;
      var pu = y > 0 ? pr[i - NX] : pr[i], pd = y < NY - 1 ? pr[i + NX] : pr[i];
      u[i] -= 0.5 * (pr[XR[x] + y * NX] - pr[XL[x] + y * NX]);
      v[i] -= 0.5 * (pd - pu);
    }
  }
  for (x = 0; x < NX; x++){ v[x] = 0; v[x + (NY - 1) * NX] = 0; }
}

function decay(dt){
  var k, i, tm = 0, f = 1 - 0.011 * dt;
  for (k = 0; k < 4; k++){
    var d = D[k];
    for (i = 0; i < N; i++){
      var q = d[i] * (frz[i] > 0.1 ? 1 : f);
      if (q > 1.25) q = 1.25; else if (!(q > 0)) q = 0;
      d[i] = q; tm += q;
    }
  }
  totalMass = tm;
  for (i = 0; i < N; i++){
    if (!(u[i] > -200 && u[i] < 200)) u[i] = 0;
    if (!(v[i] > -200 && v[i] < 200)) v[i] = 0;
  }
}

/* ================= splats ================= */
function region(gx, gy, R, cb){
  var y0 = Math.max(0, Math.floor(gy - R)), y1 = Math.min(NY - 1, Math.ceil(gy + R));
  var x0 = Math.floor(gx - R), x1 = Math.ceil(gx + R), R2 = R * R;
  for (var y = y0; y <= y1; y++){
    var dy = y - gy;
    for (var xx = x0; xx <= x1; xx++){
      var dx = xx - gx, d2 = dx * dx + dy * dy;
      if (d2 > R2) continue;
      var x = ((xx % NX) + NX) % NX;
      cb(x + y * NX, dx, dy, d2);
    }
  }
}
function splatVel(gx, gy, vx, vy, r){
  var ir = 1 / (r * r);
  region(gx, gy, r * 2.2, function(i, dx, dy, d2){ var w = Math.exp(-d2 * ir); u[i] += vx * w; v[i] += vy * w; });
}
function splatRad(gx, gy, s, r){
  var ir = 1 / (r * r);
  region(gx, gy, r * 2.2, function(i, dx, dy, d2){ var w = Math.exp(-d2 * ir) * s, dd = Math.sqrt(d2) + 0.6; u[i] += dx / dd * w; v[i] += dy / dd * w; });
}
function splatSwirl(gx, gy, s, r){
  var ir = 1 / (r * r);
  region(gx, gy, r * 2.2, function(i, dx, dy, d2){ var w = Math.exp(-d2 * ir) * s; u[i] += -dy * w; v[i] += dx * w; });
}
function addPig(gx, gy, r, amt, mix){
  var ir = 1 / (r * r);
  region(gx, gy, r * 2, function(i, dx, dy, d2){
    var w = Math.exp(-d2 * ir) * amt;
    D[0][i] += w * mix[0]; D[1][i] += w * mix[1]; D[2][i] += w * mix[2]; D[3][i] += w * mix[3];
  });
}
function cellIdx(gx, gy){ return (((Math.round(gx) % NX) + NX) % NX) + clamp(Math.round(gy), 0, NY - 1) * NX; }
function densAt(gx, gy){ var i = cellIdx(gx, gy); return D[0][i] + D[1][i] + D[2][i] + D[3][i]; }
function velAt(gx, gy){ var i = cellIdx(gx, gy); return [u[i], v[i], frz[i]]; }

/* ================= palette (from the painting) ================= */
/* channels: 0 ultramarine/indigo, 1 violet, 2 turquoise, 3 ochre-gold wash */
var MIXES = [[1,0.25,0,0],[0.25,1,0,0],[0,0.2,1,0],[0.55,0,0.85,0],[0.7,0.7,0,0],[0.1,0,0.3,1],
             [0.3,0.9,0.45,0],[0.9,0,0.2,0.2],[0,0.6,0.7,0],[0.4,0.3,0,0.6]];
function normMix(m){ var s = m[0] + m[1] + m[2] + m[3]; return [m[0]/s, m[1]/s, m[2]/s, m[3]/s]; }
function randMix(){ return normMix(pick(MIXES)); }

/* ================= cloud puffs ================= */
var puffs = [];
function spawnPuff(x, y, R, instant){
  var parts = [], n = 5 + Math.floor(Math.random() * 5);
  for (var i = 0; i < n; i++){
    var a = Math.random() * 6.2832, rr = Math.random() * R * 0.8;
    parts.push([Math.cos(a) * rr * 1.5, Math.sin(a) * rr * 0.65, R * rnd(0.35, 0.75)]);
  }
  var pf = { x: x, y: y, parts: parts, mix: randMix(), mix2: randMix(), dur: instant ? 1 : rnd(1.6, 2.8), rem: 0, amt: rnd(0.6, 0.95) };
  pf.rem = pf.dur;
  if (instant){ applyPuff(pf, 1); return; }
  puffs.push(pf);
}
function applyPuff(pf, frac){
  for (var j = 0; j < pf.parts.length; j++){
    var p = pf.parts[j], r = p[2], mix = (j % 2) ? pf.mix2 : pf.mix, amt = pf.amt * frac, r2 = r * r;
    puffPart(pf.x + p[0], pf.y + p[1], r, r2, amt, mix);
  }
}
function puffPart(x, y, r, r2, amt, mix){
  region(x, y, r, function(i, dx, dy, d2){
    var q = 1 - d2 / r2; if (q <= 0) return;
    var w = q * q * amt;
    D[0][i] += w * mix[0]; D[1][i] += w * mix[1]; D[2][i] += w * mix[2]; D[3][i] += w * mix[3];
  });
}
var massTimer = 0;
function updatePuffs(dt){
  for (var i = puffs.length - 1; i >= 0; i--){
    var pf = puffs[i], step = Math.min(dt, pf.rem);
    applyPuff(pf, step / pf.dur); pf.rem -= dt;
    if (pf.rem <= 0) puffs.splice(i, 1);
  }
  massTimer -= dt;
  if (massTimer <= 0){
    massTimer = 0.8;
    if (totalMass < N * 0.11 && puffs.length < 3){
      var edge = Math.random() < 0.5;
      spawnPuff(edge ? rnd(-4, 4) : rnd(0, NX), rnd(VNY * 0.06, VNY * 0.9), rnd(5, 11), false);
    }
  }
}
function seedSky(){
  for (var i = 0; i < 12; i++) spawnPuff(rnd(0, NX), rnd(VNY * 0.05, VNY * 0.95), rnd(5, 11), true);
}

/* ================= shape library ================= */
/* parts: [x1,y1,x2,y2,radius,(1 = hole)] in local units, y down, facing left */

  discOn = !discOn; bDisc.className = discOn ? 'ib' : 'ib off';

});
tapBtn(bReset, function(){

  u.fill(0); v.fill(0); pr.fill(0);

  seedSky(); setPrompt('A fresh sky.', 2.5); playSwell();
});

tapBtn(DOC.getElementById('closeBook'), function(){ book.style.display = 'none'; paused = false; });

function deckle(c, w, h, seed, inset){
  var i, n;
  function j(k){ return (hash2(seed, k) - 0.5) * inset * 1.4; }
  c.beginPath();
  n = Math.ceil(w / 5);
  for (i = 0; i <= n; i++){ if (i === 0) c.moveTo(inset + j(i), inset + j(i + 300)); else c.lineTo(inset + i / n * (w - 2 * inset) + j(i + 50), inset + j(i)); }
  n = Math.ceil(h / 5);
  for (i = 0; i <= n; i++) c.lineTo(w - inset + j(i + 100), inset + i / n * (h - 2 * inset) + j(i + 150));
  n = Math.ceil(w / 5);
  for (i = 0; i <= n; i++) c.lineTo(w - inset - i / n * (w - 2 * inset) + j(i + 200), h - inset + j(i + 250));
  n = Math.ceil(h / 5);
  for (i = 0; i <= n; i++) c.lineTo(inset + j(i + 350), h - inset - i / n * (h - 2 * inset) + j(i + 400));
  c.closePath();
}
var CARDCOL = ['#2c33c7','#8f38cc','#1aa8e6','#bd9438','#6a2fb0','#2a7fd4'];
function drawCard(cv, def, have){
  var w = cv.width, h = cv.height, c = cv.getContext('2d'), k = w / 100, i;
  c.clearRect(0, 0, w, h);
  c.save(); deckle(c, w, h, def.idx + 1, 4 * k); c.clip();
  c.fillStyle = '#0a0812'; c.fillRect(0, 0, w, h);
  if (have){
    for (i = 0; i < 4; i++){
      var gx = w * (0.15 + hash2(def.idx, i) * 0.7), gy = h * (0.1 + hash2(i, def.idx + 3) * 0.8), rr = w * (0.35 + hash2(def.idx + i, 9) * 0.35);
      var g = c.createRadialGradient(gx, gy, 0, gx, gy, rr), col = CARDCOL[(def.idx + i) % CARDCOL.length];
      g.addColorStop(0, col); g.addColorStop(0.6, col); g.addColorStop(1, 'rgba(10,8,18,0)');
      c.globalAlpha = 0.75; c.fillStyle = g; c.fillRect(0, 0, w, h);
    }
    c.globalAlpha = 1;
  } else {
    var g2 = c.createRadialGradient(w / 2, h / 2, 0, w / 2, h / 2, w * 0.7);
    g2.addColorStop(0, '#1d1a28'); g2.addColorStop(1, '#0a0812'); c.fillStyle = g2; c.fillRect(0, 0, w, h);
  }
  c.restore();
  c.strokeStyle = '#1c1826'; c.lineWidth = 1.2 * k; deckle(c, w, h, def.idx + 1, 4 * k); c.stroke();
  c.lineCap = 'round'; c.lineJoin = 'round';
  if (have){
    var ol = getOutline(def), sc2 = w * 0.36;
    c.save(); c.translate(w / 2, h * 0.5); c.scale(sc2, sc2);
    c.strokeStyle = PEN; c.lineWidth = 1.7 * k / sc2;
    for (i = 0; i < ol.length; i++){
      var run = ol[i]; c.beginPath(); c.moveTo(run[0], run[1]);
      for (var q = 1; q < run.length / 2; q++) c.lineTo(run[q * 2], run[q * 2 + 1]);
      c.stroke();
    }
    c.restore();
    for (i = 0; i < def.eyes.length; i++){
      var e = def.eyes[i], ex = w / 2 + e[0] * sc2, ey = h * 0.5 + e[1] * sc2, er = Math.max(2.5 * k, e[2] * sc2);
      if (!def.goldEye){ c.globalAlpha = 1; c.fillStyle = '#07060d'; c.strokeStyle = PEN; c.lineWidth = 1.2 * k; c.beginPath(); CE(c, ex, ey, er * 1.25, er, 0); c.fill(); c.stroke(); }
      goldDab(c, ex, ey, er * (def.goldEye ? 0.9 : 0.6), i + 3, 1);
    }
    c.globalAlpha = 1;
  } else {
    c.globalAlpha = 0.35; c.strokeStyle = PEN; c.lineWidth = 1.4 * k;
    if (c.setLineDash) c.setLineDash([3 * k, 5 * k]);
    c.beginPath(); c.arc(w / 2, h * 0.48, w * 0.22, 0, 6.2832); c.stroke();
    if (c.setLineDash) c.setLineDash([]);
    c.globalAlpha = 1;
  }
}
function openBook(){
  paused = true;
  var cards = DOC.getElementById('cards'), have = 0, i;
  cards.innerHTML = '';
  for (i = 0; i < SH.length; i++){
    var def = SH[i], got = !!found[def.id];
    if (got) have++;
    var wrap = DOC.createElement('div'); wrap.className = 'card';
    var cv = DOC.createElement('canvas'); cv.width = 200; cv.height = 250;
    var lab = DOC.createElement('div');
    if (got){ lab.textContent = def.label.replace(/^an? /, '') + (found[def.id] > 1 ? ' x' + found[def.id] : ''); }
    else { lab.textContent = 'not yet'; lab.className = 'n'; }
    wrap.appendChild(cv); wrap.appendChild(lab); cards.appendChild(wrap);
    drawCard(cv, def, got);
  }
  DOC.getElementById('bookStat').innerHTML = have + ' of ' + SH.length + ' shapes found<br>' + points + (points === 1 ? ' discovery' : ' discoveries') + ' so far';
  book.style.display = 'block'; book.scrollTop = 0;
}

/* ================= main loop ================= */
function resize(){
  W = window.innerWidth; H = window.innerHeight; DPR = Math.min(2, window.devicePixelRatio || 1);
  if (N === 0) NX = W > H ? 120 : 84;
  ink.width = Math.round(W * DPR); ink.height = Math.round(H * DPR);
  sky.width = Math.max(2, Math.round(W * DPR * GLS)); sky.height = Math.max(2, Math.round(H * DPR * GLS));
  CS = W / NX; VNY = H / CS;
  var need = Math.ceil(VNY) + 1;
  if (need !== NY){ allocGrid(need); if (fallback) initFallback(); }
}
var ft = 0.016, fc = 0;
function simStep(dt){
  var sdt = Math.min(dt, 0.033);
  ambient(sdt);
  updateSpots(sdt);
  updatePuffs(sdt);
  updateShapes(sdt);
  vorticity(sdt);
  project(10);
  advect(sdt);
  project(8);
  decay(sdt);
}
function loop(ts){
  requestAnimationFrame(loop);
  var dt = (ts - last) / 1000; last = ts;
  if (!(dt > 0)) dt = 0.016;
  if (dt > 0.05) dt = 0.05;
  if (!paused){
    time += dt;
    simStep(dt);
    updateDirector(dt);
    updateDoodles(dt);
    updateParts(dt);
  }
  updateAudio(dt);
  render();
  drawInk();
  ft = ft * 0.95 + dt * 0.05; fc++;
  if (fc > 150 && ft > 0.026 && GLS > 0.46){ GLS -= 0.1; fc = 0; sky.width = Math.max(2, Math.round(W * DPR * GLS)); sky.height = Math.max(2, Math.round(H * DPR * GLS)); }
}

window.addEventListener('resize', resize);
window.addEventListener('orientationchange', function(){ setTimeout(resize, 300); });
DOC.addEventListener('visibilitychange', function(){ if (!AC) return; if (DOC.hidden){ if (AC.suspend) AC.suspend(); } else if (AC.resume) AC.resume(); });

loadSave();
resize();
if (!initGL()) initFallback();
seedSky();
setMuted(muted);
bDisc.className = discOn ? 'ib' : 'ib off';
jrN.textContent = points;
requestAnimationFrame(function(ts){ last = ts; loop(ts); });
})();
